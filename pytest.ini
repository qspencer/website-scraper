[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
# Default run excludes integration tier. Use:
#   pytest -m integration                          # only integration
#   pytest -m "integration or not integration"     # everything
#   pytest -m "integration and not live_ai"        # integration minus paid AI calls
addopts = -v --tb=short -m "not integration"
markers =
    integration: hits real backends (MongoDB, AI, Stirling-PDF, Playwright); excluded by default
    live_ai: makes a real billable call to the configured AI endpoint
    playwright: requires a real Chromium install (playwright install chromium)
