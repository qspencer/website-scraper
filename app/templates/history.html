{% extends "base.html" %}

{% block content %}
<div class="max-w-6xl mx-auto">
    <div class="bg-white rounded-lg shadow-md p-6">
        <div class="flex items-center justify-between mb-6">
            <h1 class="text-2xl font-bold text-gray-800">Scan History</h1>
            <div class="flex items-center gap-3">
                <button
                    id="clearHistoryBtn"
                    onclick="clearHistory()"
                    class="text-sm text-red-600 hover:text-red-800 transition hidden"
                    title="Removes scan_history rows only — does NOT delete documents stored in MongoDB. Use the trash icon next to a scan to fully delete it."
                >
                    Clear History List
                </button>
                <a href="/" class="text-blue-600 hover:text-blue-800 text-sm">Back to Scanner</a>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loadingState" class="text-center py-8">
            <div class="spinner mx-auto mb-4" style="width: 32px; height: 32px;"></div>
            <p class="text-gray-500">Loading history...</p>
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="hidden text-center py-12">
            <svg class="w-16 h-16 text-gray-300 mx-auto mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <p class="text-gray-500 text-lg">No scan history yet</p>
            <p class="text-gray-400 mt-1">Completed scans will appear here</p>
        </div>

        <!-- History Table -->
        <div id="historyTable" class="hidden overflow-x-auto">
            <table class="w-full text-sm">
                <thead>
                    <tr class="border-b border-gray-200 text-left">
                        <th class="py-3 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Date</th>
                        <th class="py-3 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">URL</th>
                        <th class="py-3 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide">Mode</th>
                        <th class="py-3 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide text-right">Depth</th>
                        <th class="py-3 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide text-right">Pages</th>
                        <th class="py-3 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide text-right">Docs</th>
                        <th class="py-3 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide text-right">Time</th>
                        <th class="py-3 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide text-right">Errors</th>
                        <th class="py-3 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide text-right">Total Size</th>
                        <th class="py-3 px-3 text-xs font-semibold text-gray-500 uppercase tracking-wide text-center w-12"></th>
                    </tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-lg shadow-xl p-6 max-w-md w-full mx-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-lg font-semibold text-gray-800">Scan Details</h2>
                <button onclick="closeDetail()" class="text-gray-400 hover:text-gray-600">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <div id="detailContent" class="space-y-3"></div>
            <button onclick="closeDetail()" class="w-full mt-4 py-2 px-4 bg-blue-600 text-white font-medium rounded-lg hover:bg-blue-700 transition">
                Close
            </button>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', loadHistory);

    async function loadHistory() {
        try {
            const response = await fetch('/api/history');
            if (!response.ok) throw new Error('Failed to load history');

            const data = await response.json();
            document.getElementById('loadingState').classList.add('hidden');

            if (data.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }

            document.getElementById('historyTable').classList.remove('hidden');
            document.getElementById('clearHistoryBtn').classList.remove('hidden');
            renderHistory(data);

        } catch (error) {
            console.error('Error loading history:', error);
            document.getElementById('loadingState').innerHTML =
                '<p class="text-red-600">Failed to load history</p>';
        }
    }

    function renderHistory(scans) {
        const tbody = document.getElementById('historyBody');
        tbody.innerHTML = '';

        scans.forEach(scan => {
            const row = document.createElement('tr');
            row.className = 'border-b border-gray-100 hover:bg-gray-50 cursor-pointer transition';
            row.onclick = () => showDetail(scan);

            const date = scan.completed_at ? formatDate(scan.completed_at) : '-';
            const url = truncateUrl(scan.url, 40);
            const mode = formatMode(scan.scan_mode);
            const depth = scan.crawl_option === 'single' ? '-' : scan.max_depth;
            const duration = scan.duration_seconds != null ? formatDuration(scan.duration_seconds) : '-';
            const errors = (scan.scan_error_count || 0) + (scan.document_error_count || 0);
            const totalSize = scan.total_size_bytes ? formatFileSize(scan.total_size_bytes) : '-';

            row.innerHTML = `
                <td class="py-3 px-3 text-gray-600 whitespace-nowrap">${date}</td>
                <td class="py-3 px-3 text-gray-800 font-medium" title="${escapeHtml(scan.url)}">${escapeHtml(url)}</td>
                <td class="py-3 px-3"><span class="px-2 py-0.5 rounded-full text-xs font-medium ${modeClass(scan.scan_mode)}">${mode}</span></td>
                <td class="py-3 px-3 text-right text-gray-600">${depth}</td>
                <td class="py-3 px-3 text-right text-gray-600">${(scan.pages_scanned || 0).toLocaleString()}</td>
                <td class="py-3 px-3 text-right font-medium text-green-700">${(scan.documents_found || 0).toLocaleString()}</td>
                <td class="py-3 px-3 text-right text-gray-600">${duration}</td>
                <td class="py-3 px-3 text-right ${errors > 0 ? 'text-red-600' : 'text-gray-400'}">${errors}</td>
                <td class="py-3 px-3 text-right text-gray-600">${totalSize}</td>
                <td class="py-3 px-3 text-center">
                    <button
                        title="Delete this scan and all its stored documents"
                        class="text-gray-400 hover:text-red-600 transition"
                        onclick="event.stopPropagation(); deleteScan('${encodeURIComponent(scan.url)}', ${scan.documents_found || 0});"
                    >&#128465;</button>
                </td>
            `;
            tbody.appendChild(row);
        });
    }

    async function deleteScan(encodedScanUrl, docCount) {
        const scanUrl = decodeURIComponent(encodedScanUrl);
        const msg = `Delete the scan of "${scanUrl}" and all ${docCount} of its stored documents? This cannot be undone.`;
        if (!confirm(msg)) return;
        try {
            const resp = await fetch(
                '/api/download/mongodb/scan?scan_url=' + encodedScanUrl,
                { method: 'DELETE' }
            );
            if (!resp.ok) {
                const err = await resp.json().catch(() => ({}));
                alert(`Delete failed: ${err.detail || resp.statusText}`);
                return;
            }
            const result = await resp.json();
            alert(
                `Deleted: ${result.documents_deleted} documents, ${result.gridfs_files_deleted} GridFS files` +
                (result.category_set_deleted ? ', category set' : '') +
                `, ${result.history_rows_deleted} history rows.`
            );
            loadHistory();  // refresh table
        } catch (e) {
            alert(`Delete failed: ${e.message}`);
        }
    }

    function showDetail(scan) {
        const content = document.getElementById('detailContent');
        const filterLabels = {common: 'Common Documents', all: 'All Files', pdf_only: 'PDFs Only'};
        const duration = scan.duration_seconds != null ? formatDuration(scan.duration_seconds) : '-';
        const totalSize = scan.total_size_bytes ? formatFileSize(scan.total_size_bytes) : 'Unknown';
        const largest = scan.largest_file_name
            ? `${scan.largest_file_name} (${formatFileSize(scan.largest_file_size)})`
            : 'Unknown';
        const smallest = scan.smallest_file_name
            ? `${scan.smallest_file_name} (${formatFileSize(scan.smallest_file_size)})`
            : 'Unknown';

        content.innerHTML = `
            <div class="flex items-start gap-3">
                <svg class="w-5 h-5 text-blue-500 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"/>
                </svg>
                <div class="min-w-0">
                    <p class="text-xs text-gray-500 uppercase tracking-wide">URL Scanned</p>
                    <p class="text-sm text-gray-800 break-all">${escapeHtml(scan.url)}</p>
                </div>
            </div>

            <div class="grid grid-cols-3 gap-3">
                <div class="bg-gray-50 rounded-lg p-3">
                    <p class="text-xs text-gray-500 uppercase tracking-wide">Crawl Depth</p>
                    <p class="text-sm font-semibold text-gray-800">${scan.crawl_option === 'single' ? 'Single page' : scan.max_depth + ' levels'}</p>
                </div>
                <div class="bg-gray-50 rounded-lg p-3">
                    <p class="text-xs text-gray-500 uppercase tracking-wide">Scan Mode</p>
                    <p class="text-sm font-semibold text-gray-800">${formatMode(scan.scan_mode)}</p>
                </div>
                <div class="bg-gray-50 rounded-lg p-3">
                    <p class="text-xs text-gray-500 uppercase tracking-wide">Filter</p>
                    <p class="text-sm font-semibold text-gray-800">${filterLabels[scan.document_filter] || scan.document_filter}</p>
                </div>
            </div>

            <hr class="border-gray-200">

            <div class="grid grid-cols-3 gap-3">
                <div class="bg-gray-50 rounded-lg p-3">
                    <p class="text-xs text-gray-500 uppercase tracking-wide">Pages Scanned</p>
                    <p class="text-xl font-semibold text-gray-800">${(scan.pages_scanned || 0).toLocaleString()}</p>
                </div>
                <div class="bg-green-50 rounded-lg p-3">
                    <p class="text-xs text-green-600 uppercase tracking-wide">Documents Found</p>
                    <p class="text-xl font-semibold text-green-700">${(scan.documents_found || 0).toLocaleString()}</p>
                </div>
                <div class="bg-blue-50 rounded-lg p-3">
                    <p class="text-xs text-blue-600 uppercase tracking-wide">Total Time</p>
                    <p class="text-xl font-semibold text-blue-700">${duration}</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-3">
                <div class="bg-gray-50 rounded-lg p-3">
                    <p class="text-xs text-gray-500 uppercase tracking-wide">Scan Errors</p>
                    <p class="text-sm font-semibold text-gray-800">${scan.scan_error_count || 0}</p>
                </div>
                <div class="bg-gray-50 rounded-lg p-3">
                    <p class="text-xs text-gray-500 uppercase tracking-wide">Document Errors</p>
                    <p class="text-sm font-semibold text-gray-800">${scan.document_error_count || 0}</p>
                </div>
            </div>

            <div class="bg-purple-50 rounded-lg p-3">
                <p class="text-xs text-purple-600 uppercase tracking-wide">Total Size</p>
                <p class="text-sm font-semibold text-purple-700">${totalSize}</p>
            </div>
            <div class="bg-purple-50 rounded-lg p-3">
                <p class="text-xs text-purple-600 uppercase tracking-wide">Largest Document</p>
                <p class="text-sm font-semibold text-purple-700 break-all">${escapeHtml(largest)}</p>
            </div>
            <div class="bg-purple-50 rounded-lg p-3">
                <p class="text-xs text-purple-600 uppercase tracking-wide">Smallest Document</p>
                <p class="text-sm font-semibold text-purple-700 break-all">${escapeHtml(smallest)}</p>
            </div>
        `;

        document.getElementById('detailModal').classList.remove('hidden');
    }

    function closeDetail() {
        document.getElementById('detailModal').classList.add('hidden');
    }

    async function clearHistory() {
        if (!confirm('Clear all scan history?')) return;

        try {
            const response = await fetch('/api/history', { method: 'DELETE' });
            if (response.ok) {
                document.getElementById('historyTable').classList.add('hidden');
                document.getElementById('clearHistoryBtn').classList.add('hidden');
                document.getElementById('emptyState').classList.remove('hidden');
            }
        } catch (error) {
            console.error('Error clearing history:', error);
        }
    }

    function formatDate(isoStr) {
        const d = new Date(isoStr);
        const now = new Date();
        const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
        const dateOnly = new Date(d.getFullYear(), d.getMonth(), d.getDate());

        const time = d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

        if (dateOnly.getTime() === today.getTime()) {
            return `Today ${time}`;
        }

        const yesterday = new Date(today);
        yesterday.setDate(yesterday.getDate() - 1);
        if (dateOnly.getTime() === yesterday.getTime()) {
            return `Yesterday ${time}`;
        }

        return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ` ${time}`;
    }

    function formatDuration(seconds) {
        if (seconds < 60) return `${Math.round(seconds)}s`;
        if (seconds < 3600) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.round(seconds % 60);
            return secs > 0 ? `${mins}m ${secs}s` : `${mins}m`;
        }
        const hours = Math.floor(seconds / 3600);
        const mins = Math.round((seconds % 3600) / 60);
        return `${hours}h ${mins}m`;
    }

    function formatFileSize(bytes) {
        if (!bytes || bytes === 0) return '0 B';
        const units = ['B', 'KB', 'MB', 'GB', 'TB'];
        const i = Math.floor(Math.log(bytes) / Math.log(1024));
        const size = bytes / Math.pow(1024, i);
        return `${size.toFixed(i > 0 ? 1 : 0)} ${units[i]}`;
    }

    function formatMode(mode) {
        const labels = {'single page': 'Single', 'batch': 'Batch', 'continuous': 'Continuous'};
        return labels[mode] || mode;
    }

    function modeClass(mode) {
        if (mode === 'continuous') return 'bg-blue-100 text-blue-700';
        if (mode === 'batch') return 'bg-amber-100 text-amber-700';
        return 'bg-gray-100 text-gray-700';
    }

    function truncateUrl(url, maxLen) {
        try {
            const u = new URL(url);
            let display = u.hostname + u.pathname;
            if (display.length > maxLen) {
                display = display.substring(0, maxLen - 3) + '...';
            }
            return display;
        } catch {
            return url.length > maxLen ? url.substring(0, maxLen - 3) + '...' : url;
        }
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }
</script>
{% endblock %}
